<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohamed Reda Zain</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#2433ff;--dot:rgba(255,255,255,.16);--ink:#0a0a23;--orange:#ff5a1f;--pink:#ff4f9a;--cyan:#3ff0e6;--yellow:#ffe500;--paper:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue:#1a24c4;--dot:rgba(255,255,255,.1);color-scheme:dark}}
:root[data-theme="dark"]{--blue:#1a24c4;--dot:rgba(255,255,255,.1);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;background:var(--blue)}
body{margin:0;min-height:100vh;background-color:var(--blue);background-image:radial-gradient(var(--dot) 1.5px,transparent 1.6px);background-size:18px 18px;color:var(--ink);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.bar{background:var(--ink);color:var(--paper);overflow:hidden;white-space:nowrap;border-bottom:3px solid var(--ink)}
.track{display:inline-flex;animation:slide 22s linear infinite;padding:11px 0}
.track span{font-family:"Dela Gothic One",Impact,sans-serif;font-size:15px;margin:0 14px}
.track i{font-style:normal;color:var(--yellow);font-size:15px}
@keyframes slide{to{transform:translateX(-50%)}}
main{max-width:440px;margin:0 auto;padding:26px 22px 48px}
.hero{position:relative;width:80%;margin:0 auto}
.photo{position:relative;aspect-ratio:4/4.7;background:var(--yellow);border:4px solid var(--ink);box-shadow:7px 7px 0 var(--ink);transform:rotate(-2deg);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block;}
.badge{position:absolute;top:-18px;right:-14px;width:90px;height:90px;border-radius:50%;background:var(--yellow);border:4px solid var(--ink);display:grid;place-items:center;text-align:center;transform:rotate(12deg);font-family:"Dela Gothic One",Impact,sans-serif;font-size:12px;line-height:1.1;box-shadow:4px 4px 0 var(--ink)}
h1{position:relative;margin:-46px 0 10px;text-align:center;font-family:"Dela Gothic One",Impact,sans-serif;font-weight:400;font-size:clamp(34px,11vw,48px);line-height:.98;color:var(--paper);text-shadow:4px 4px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);letter-spacing:-.01em}
.links{display:flex;flex-direction:column;gap:14px}
a.link{display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:66px;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);color:var(--ink);text-decoration:none;transition:transform .12s ease,box-shadow .12s ease}
a.link:hover,a.link:focus-visible{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
a.link:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--ink)}
a.link:focus-visible{outline:3px solid var(--paper);outline-offset:4px}
.ig{background:var(--pink)}.tt{background:var(--cyan)}.sc{background:var(--yellow)}.xx{background:#c9b6ff}
.ic{flex:none;width:48px;height:48px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;display:grid;place-items:center}
.ic svg{width:26px;height:26px}
.t b{display:block;font-family:"Dela Gothic One",Impact,sans-serif;font-weight:400;font-size:21px;line-height:1.1}
.t span{display:block;font-weight:700;font-size:15px;margin-top:3px}
.tag{margin:0 0 24px;text-align:center;font-weight:700;font-size:16px;color:var(--paper);animation:up .6s .5s ease-out backwards}
.tools{display:flex;gap:12px;margin-top:22px}
.tool{flex:1;min-height:52px;font:700 16px "Space Grotesk",system-ui,sans-serif;color:var(--ink);background:var(--paper);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,box-shadow .12s ease;animation:in .5s 1.15s ease-out backwards}
.tool:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.tool:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
.tool:focus-visible{outline:3px solid var(--paper);outline-offset:4px}
.tool svg{width:20px;height:20px}
:root[data-palette="2"]{--blue:#12122b;--dot:rgba(255,255,255,.09)}
:root[data-palette="3"]{--blue:#7b3cff;--dot:rgba(255,255,255,.18)}
:root[data-palette="4"]{--blue:#0a8f80;--dot:rgba(255,255,255,.16)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,10,35,.55)}
.sheet[hidden]{display:none}
.sheet-in{width:100%;max-width:440px;background:var(--paper);border:4px solid var(--ink);border-bottom:0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s ease-out}
.sheet h2{margin:0 0 14px;font:400 22px "Dela Gothic One",Impact,sans-serif;color:var(--ink)}
.srow{display:flex;gap:10px;margin-bottom:14px}
.srow input{flex:1;min-width:0;font:500 14px "Space Grotesk",system-ui,sans-serif;padding:12px;border:3px solid var(--ink);background:#fff;color:var(--ink)}
.srow button,.chips a,.sclose{font:700 15px "Space Grotesk",system-ui,sans-serif;border:3px solid var(--ink);background:var(--yellow);color:var(--ink);padding:12px 14px;cursor:pointer}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips a{text-align:center;text-decoration:none;background:var(--paper)}
.sclose{width:100%;margin-top:14px;background:var(--ink);color:var(--paper)}
.sheet button:focus-visible,.sheet a:focus-visible,.sheet input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@keyframes drop{0%{transform:translateY(-70px) rotate(-12deg) scale(.9);opacity:0}60%{transform:translateY(8px) rotate(1deg) scale(1.02);opacity:1}100%{transform:rotate(-2deg)}}
@keyframes pop{from{transform:scale(0) rotate(-50deg)}to{transform:rotate(12deg)}}
@keyframes wob{0%,100%{transform:rotate(12deg)}50%{transform:rotate(20deg) scale(1.07)}}
@keyframes up{from{transform:translateY(26px);opacity:0}}
@keyframes in{from{transform:translateX(-44px);opacity:0}}
.photo{animation:drop .9s cubic-bezier(.2,.9,.3,1.1) backwards}
.badge{animation:pop .6s .7s cubic-bezier(.3,1.6,.5,1) backwards,wob 4s 1.4s ease-in-out infinite}
h1{animation:up .6s .4s ease-out backwards}
a.link{animation:in .5s ease-out backwards}
a.link:nth-child(1){animation-delay:.65s}a.link:nth-child(2){animation-delay:.77s}a.link:nth-child(3){animation-delay:.89s}a.link:nth-child(4){animation-delay:1.01s}
@media (prefers-reduced-motion:reduce){.track,.photo,.badge,h1,.tag,.tool,a.link{animation:none}a.link,.tool{transition:none}}
</style></head><body>

</main><script>
(function(){
var root=document.documentElement,N=4,cur=1;
function setP(n){if(n===1){root.removeAttribute('data-palette')}else{root.setAttribute('data-palette',String(n))}}
try{var s=parseInt(localStorage.getItem('palette'),10);if(s>=1&&s<=N){cur=s}}catch(e){}
setP(cur);
document.getElementById('colors').addEventListener('click',function(){cur=cur%N+1;setP(cur);try{localStorage.setItem('palette',String(cur))}catch(e){}});
var sb=document.getElementById('share'),lab=sb.querySelector('span');
function flash(t){var o=lab.textContent;lab.textContent=t;setTimeout(function(){lab.textContent=o},1600)}
var sheet=document.getElementById('sheet'),surl=document.getElementById('surl'),scopy=document.getElementById('scopy');
function guess(){var u=location.href;try{if(window.top!==window&&document.referrer){u=document.referrer}}catch(e){}return u}
function openSheet(u){var e=encodeURIComponent,t=e(document.title);surl.value=u;
document.getElementById('s-wa').href='https://wa.me/?text='+e(document.title+' '+u);
document.getElementById('s-tg').href='https://t.me/share/url?url='+e(u)+'&text='+t;
document.getElementById('s-x').href='https://twitter.com/intent/tweet?url='+e(u)+'&text='+t;
document.getElementById('s-fb').href='https://www.facebook.com/sharer/sharer.php?u='+e(u);
sheet.hidden=false;scopy.textContent='Copy';surl.focus();surl.select()}
function closeSheet(){sheet.hidden=true}
sb.addEventListener('click',async function(){
var u=guess();
try{if(navigator.share){await navigator.share({title:document.title,url:u});return}}catch(e){if(e&&e.name==='AbortError')return}
openSheet(u)});
scopy.addEventListener('click',async function(){
var ok=false;
try{await navigator.clipboard.writeText(surl.value);ok=true}catch(e){}
if(!ok){try{surl.select();ok=document.execCommand('copy')}catch(e){}}
scopy.textContent=ok?'Copied!':'Press and hold the link to copy'});
document.getElementById('sclose').addEventListener('click',closeSheet);
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
})();
</script></body></html>
